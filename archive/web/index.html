<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成长站 · 书影音档案</title>
<style>
:root{--ink:#3a342a;--muted:#8c8577;--accent:#a9843b;--line:#e6e0d2;--bg:#faf7f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,"PingFang SC","Noto Serif SC",serif;line-height:1.7}
header{border-bottom:1px solid var(--line);background:#fffdf7;padding:22px 20px}
header .wrap{max-width:960px;margin:0 auto;display:flex;align-items:baseline;
 justify-content:space-between;flex-wrap:wrap;gap:8px}
h1{font-size:22px;margin:0} h1 small{color:var(--muted);font-weight:400;font-size:13px}
nav a{margin-left:16px;color:var(--accent);text-decoration:none;font-size:14px}
.wrap{max-width:960px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;
 padding:6px 16px;cursor:pointer;color:var(--ink)}
.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;
 margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:17px}
.card h3 a{color:var(--ink);text-decoration:none}
.badge{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--line);
 border-radius:4px;padding:0 6px;margin-right:6px}
.muted{color:var(--muted);font-size:13px}
.note{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.note .quote{color:#5b5346;border-left:3px solid #d8c38a;padding-left:10px;margin:6px 0}
mark{background:#f3e6b8;padding:0 2px;border-radius:2px}
input[type=search]{width:100%;padding:10px 14px;border:1px solid var(--line);
 border-radius:8px;font-size:15px}
.basis{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:12px 16px;
 font-size:13px;color:#6b6455;margin-bottom:18px}
.basis b{color:var(--ink)}
.more{width:100%;padding:12px;border:1px solid var(--line);background:#fff;border-radius:8px;
 cursor:pointer;font-size:14px;color:var(--accent)}
.prov{font-size:12.5px;color:var(--muted);background:#fbf8f0;border:1px solid var(--line);
 border-radius:8px;padding:10px 12px;margin-top:8px}
a.share{font-size:12px;color:var(--accent);margin-right:10px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.pill{font-size:12px;color:var(--ink);background:#f3eee0;border-radius:999px;padding:4px 12px;
 text-decoration:none}
footer{max-width:960px;margin:30px auto 50px;color:var(--muted);font-size:12px;padding:0 20px}
</style></head>
<body>
<header><div class="wrap">
  <h1>成长站 · 书影音档案 <small>读过的书 · 看过的影 · 听过的音</small></h1>
  <nav>
    <a href="#" data-tab="feed">最新</a>
    <a href="#" data-tab="years">年份</a>
    <a href="#" data-tab="topics">主题</a>
    <a href="#" data-tab="stats">统计</a>
    <a href="/admin">管理端</a>
  </nav>
</div></header>
<div class="wrap">
  <div style="margin-bottom:14px">
    <input type="search" id="q" placeholder="搜索公开的笔记与作品（私密/待公开内容不会出现）">
  </div>
  <div id="search"></div>
  <div id="view"></div>
</div>
<footer>
  第三方信息仅作引用线索；摘录的著作权归原权利人所有，是否公开由站主逐条勾选。
  <a href="/api/public/export">导出 JSON</a> ·
  <a href="/api/public/export?format=markdown">导出 Markdown</a>
</footer>
<script>
const $ = s => document.querySelector(s);
const api = (p) => fetch(p).then(r => r.json());
const esc = s => (s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND = {book:'书',film:'影',music:'音'};
let feedCursor = null;

async function showSearch(){
  const q = $('#q').value.trim();
  if(!q){ $('#search').innerHTML=''; return; }
  const d = await api('/api/public/search?q='+encodeURIComponent(q));
  $('#search').innerHTML = '<div class="card">'+
    d.results.map(r=>`<h3>《${esc(r.title)}》</h3>
      <div>${highlight(r.snippet,q)}</div>
      <a class="share" href="/share/${r.note_id}" target="_blank">分享卡</a>`).join('')
    || '<p class="muted">没有匹配的公开内容。</p></div>';
  $('#view').innerHTML='';
}
function highlight(text,q){
  let safe=esc(text);
  try{const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    safe=safe.replace(re,'<mark>$1</mark>');}catch(e){}
  return safe;
}

async function tabFeed(){
  $('#search').innerHTML='';
  feedCursor = null;
  $('#view').innerHTML='<div id="feed"></div><p style="text-align:center;margin-top:14px">'
    +'<button class="more" id="more">加载更早的条目</button></p>';
  $('#more').onclick = loadFeed;
  await loadFeed();
}
async function loadFeed(){
  const u = '/api/public/feed?limit=10'+(feedCursor?('&cursor='+feedCursor):'');
  const d = await api(u);
  $('#feed').insertAdjacentHTML('beforeend', d.items.map(noteCard).join(''));
  feedCursor = d.next_cursor;
  $('#more').style.display = feedCursor ? '' : 'none';
  if(!feedCursor)$('#more').parentElement.innerHTML='<span class="muted">— 已经到底 —</span>';
}
function noteCard(n){
  const w=n.work||{};
  return `<div class="card"><h3><span class="badge">${KIND[w.kind]||''}</span>
    <a href="#" onclick="showWork(${w.id});return false">《${esc(w.title)}》</a>
    ${w.creator?'<small class="muted">'+esc(w.creator)+'</small>':''}</h3>
    <div class="muted">${(n.published_at||'').slice(0,10)}
      ${n.event?(' · '+{read:'阅读',watch:'观看',listen:'聆听'}[n.event.kind]+'于 '+n.event.date):''}</div>
    ${n.excerpt?`<div class="note"><div class="quote">${esc(n.excerpt)}
      ${n.excerpt_from?'<small>（'+esc(n.excerpt_from)+'）</small>':''}</div></div>`:''}
    ${n.body?`<div class="note">${esc(n.body)}</div>`:''}
    <div style="margin-top:8px"><a class="share" href="/share/${n.id}" target="_blank">分享卡 ↗</a></div>
  </div>`;
}

async function tabYears(){
  $('#search').innerHTML='';
  const d = await api('/api/public/years');
  $('#view').innerHTML = basisBox('year')+
    '<div class="row">'+d.years.map(y=>`<a class="pill" href="#" onclick="showYear(${y.year});return false">
      ${y.year} 年 · ${y.event_count} 次经历 / ${y.work_count} 部作品</a>`).join('')+'</div>';
}
async function showYear(year){
  const d = await api('/api/public/years/'+year);
  $('#view').innerHTML = basisBox('year')+
    `<h2>${year} 年 <small class="muted">${d.events.length} 次经历</small></h2>`
    + d.events.map(eventCard).join('');
  window.scrollTo(0,0);
}
function eventCard(e){
  return `<div class="card">
    <h3><span class="badge">${KIND[e.work_kind]||''}</span>
      <a href="#" onclick="showWork(${e.work_id});return false">《${esc(e.work_title)}》</a>
      ${e.creator?'<small class="muted">'+esc(e.creator)+'</small>':''}</h3>
    <div class="muted">${e.date} · ${e.version_label?esc(e.version_label):'未指定版本'}
      ${e.rating?(' · 评分 '+e.rating):''}</div>
    ${(e.topics||[]).length?'<div class="muted">主题：'+e.topics.map(t=>esc(t.name)).join('、')+'</div>':''}
    ${e.personal_gain?`<div class="note"><b>个人收获：</b>${esc(e.personal_gain)}</div>`:''}
    ${e.notes.map(n=>`<div class="note">
      ${n.excerpt?'<div class="quote">'+esc(n.excerpt)+(n.excerpt_from?' <small>（'+esc(n.excerpt_from)+'）</small>':'')+'</div>':''}
      ${n.body?esc(n.body):''} <a class="share" href="/share/${n.id}" target="_blank">分享卡</a></div>`).join('')}
  </div>`;
}

async function tabTopics(){
  $('#search').innerHTML='';
  const d = await api('/api/public/topics');
  $('#view').innerHTML = '<p class="muted">主题重命名后旧链接仍然有效，名称变迁会在主题页显示。</p>'
    +'<div class="row">'+d.topics.map(t=>`<a class="pill" href="#"
      onclick="showTopic('${t.slug}');return false">${esc(t.name)} · ${t.event_count}</a>`).join('')+'</div>';
}
async function showTopic(slug){
  const d = await api('/api/public/topics/'+encodeURIComponent(slug));
  if(d.error){$('#view').innerHTML='<div class="card">'+esc(d.error)+'</div>';return;}
  $('#view').innerHTML = `<h2>${esc(d.topic.name)}</h2>`
    +(d.previous_names.length?`<p class="muted">曾用名：${d.previous_names.map(r=>esc(r.old_name)).join(' → ')} → ${esc(d.topic.name)}</p>`:'')
    + d.events.map(eventCard).join('')
    || '<p class="muted">该主题下暂无公开条目。</p>';
  window.scrollTo(0,0);
}

async function tabStats(){
  $('#search').innerHTML='';
  const d = await api('/api/public/stats');
  $('#view').innerHTML = basisBox('stats')+
   `<div class="card"><h3>总计</h3>
     <p>经历（事件） <b>${d.totals.events}</b> 次 ｜ 去重作品 <b>${d.totals.works}</b> 部 ｜
        已发布笔记 <b>${d.totals.notes}</b> 篇</p>
     <h3>按年份</h3><table style="width:100%;border-collapse:collapse">
     <tr style="text-align:left"><th>年份</th><th>事件数（重读也算）</th><th>作品数（去重）</th></tr>`
   + d.by_year.map(y=>`<tr><td>${y.year}</td><td>${y.events}</td><td>${y.works}</td></tr>`).join('')
   + '</table><h3>按媒介</h3>'
   + '<div class="row">'+d.by_kind.map(k=>`<span class="pill">${({book:'书',film:'影',music:'音'})[k.kind]}：${k.events} 次 / ${k.works} 部</span>`).join('')+'</div></div>';
}
function basisBox(kind){
  return `<div class="basis"><b>统计口径：</b>
    “事件”指一次阅读/观看/聆听经历，<b>重读、重看、重听是新的经历，不是重复数据</b>；
    “作品”按去重后的作品计数，同一作品的不同译本、版本只计一次。
    页面只显示已发布的笔记，私密与待公开内容不出现。</div>`;
}

async function showWork(id){
  const d = await api('/api/public/works/'+id).catch(e=>({error:'加载失败'}));
  if(d.error){$('#view').innerHTML='<div class="card">'+esc(d.error)+'</div>';return;}
  const w=d.work;
  $('#search').innerHTML='';
  $('#view').innerHTML = `<div class="card">
    <h3><span class="badge">${KIND[w.kind]}</span>《${esc(w.title)}》
      <small class="muted">${esc(w.creator||'')}${w.origin_year?' · '+w.origin_year:''}</small></h3>
    <p class="muted">${w.versions.length} 个版本：${w.versions.map(v=>esc(v.label||('版本#'+v.id))).join('；')}</p>
    <p class="muted">外部标识：${w.identifiers.map(i=>esc(i.namespace+':'+i.ext_id)).join('，')||'无'}</p>
    ${provBlock(d.merge_provenance)}
    ${d.events.map(eventCard).join('')}
  </div>`;
  window.scrollTo(0,0);
}
function provBlock(p){
  if(!p.groups.length && !p.log.length) return '';
  return `<div class="prov"><b>合并来历：</b><ul style="margin:6px 0;padding-left:18px">`
    + p.groups.map(g=>`<li>并入规范作品 #${g.canonical_work_id}；原因：${esc(g.reason||'（人工）')}；
       成员：${g.members.map(m=>esc(m.title_snapshot)+'（#'+m.duplicate_work_id+'）').join('、')}
       ${g.evidence?'；证据：<a href="'+esc(g.evidence)+'">链接</a>':''}</li>`).join('')
    + (p.groups.length?'':p.log.map(l=>`<li>${esc(l.action)} @ ${esc(l.created_at)}</li>`).join(''))
    + '</ul>拆分后的作品会重新独立显示，事件与笔记可以重新归属。</div>';
}

document.querySelectorAll('nav a[data-tab]').forEach(a=>{
  a.onclick = e=>{e.preventDefault();
    ({feed:tabFeed,years:tabYears,topics:tabTopics,stats:tabStats})[a.dataset.tab]();};
});
let t; $('#q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(showSearch,250);});
tabFeed();
</script>
</body></html>
